name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # CI odtwarza czystą instalację dokładnie z package-lock.json.
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Pełna weryfikacja obejmuje lint, typy, testy, build i przepływ E2E.
      - name: Verify project
        run: npm run verify:full

      - name: Verify live-eval cost preflight
        run: npm run eval:live:preflight

      - name: Verify clean diff and worktree
        shell: bash
        run: |
          git diff --check
          git status --short
          test -z "$(git status --short)"

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14
